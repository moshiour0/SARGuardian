name: Scientific engine regression tests

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/science-tests.yml"
  push:
    branches:
      - main
      - science/valid-pixel-target4-9-audit
      - fix/science-regression-guards-20261029
    paths:
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/science-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  science-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out scientific engine
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir --retries 5 --timeout 45 -r requirements.txt
      - name: Run complete scientific regression suite
        run: python -m pytest tests/ -q
