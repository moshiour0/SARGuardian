name: Target 4/9 raw NISAR diagnostics

on:
  pull_request:
    paths:
      - "src/gunw_reader.py"
      - "src/goff_reader.py"
      - "tools/download_target49_products.py"
      - "tools/target49_gate_diagnostic.py"
      - "tests/**"
      - ".github/workflows/target49-raw-diagnostic.yml"

permissions:
  contents: read

concurrency:
  group: target49-raw-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout isolated scientific branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir --retries 5 --timeout 45 -r requirements.txt
      - name: Test the gate diagnostic and maturity handling
        run: python -m pytest tests/test_target49_gate_diagnostic.py tests/test_bound.py -q
      - name: Download and diagnose exact Run #55 raw HDF5 products
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs
          if [[ -n "${EARTHDATA_TOKEN}" ]]; then
            echo "Using repository-scoped Earthdata token without writing it to disk."
            python tools/download_target49_products.py --profile target4-9-focused --outdir data/target49_raw
          elif [[ -n "${EARTHDATA_USERNAME}" && -n "${EARTHDATA_PASSWORD}" ]]; then
            umask 077
            printf 'machine urs.earthdata.nasa.gov login %s password %s\n' "${EARTHDATA_USERNAME}" "${EARTHDATA_PASSWORD}" > "${HOME}/.netrc"
            trap 'rm -f "${HOME}/.netrc"' EXIT
            python tools/download_target49_products.py --profile target4-9-focused --outdir data/target49_raw
          else
            echo "RAW_HDF5_DIAGNOSTIC_SKIPPED: Configure EARTHDATA_TOKEN or EARTHDATA_USERNAME and EARTHDATA_PASSWORD repository secrets." | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          shopt -s nullglob
          files=(data/target49_raw/*.h5)
          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "No raw HDF5 files were downloaded." | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          python tools/target49_gate_diagnostic.py "${files[@]}" --aoi source --out outputs/target49_source_aoi.json
          python tools/target49_gate_diagnostic.py "${files[@]}" --aoi langtang --out outputs/target49_langtang_aoi.json
          echo "Raw HDF5 files were analyzed in memory/on runner; only diagnostic JSON and manifest are uploaded." >> "${GITHUB_STEP_SUMMARY}"
      - name: Preserve diagnostic summaries, not raw HDF5
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: target49-raw-diagnostic
          path: |
            outputs/target49_source_aoi.json
            outputs/target49_langtang_aoi.json
            data/target49_raw/download_manifest.json
          if-no-files-found: ignore
          retention-days: 14
